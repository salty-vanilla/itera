name: Check

on:
  pull_request:
  # Pushes to main run this through deploy.yml, which deploys only after it
  # passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # From the browser through the Worker's static assets, the API and a local
  # D1 (Issue #370, ADR 0008). A job of its own beside `check`, so that it
  # runs at the same time and its time does not count against check's.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser of the @playwright/test pinned in services/api, and the
      # system libraries it needs.
      - name: Install the browser
        run: pnpm --filter @itera/api exec playwright install --with-deps --only-shell chromium
      # Builds the Web app, then starts `wrangler dev` with placeholder
      # settings (no secret is given to this job).
      - run: pnpm e2e
      # The failed tests' traces. They hold only the tests' placeholder data.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: services/api/test-results/
          retention-days: 7

  # The contract against the pull request's base: the breaking changes that
  # oasdiff finds, and whether info.version moved as ADR 0006 「互換の規則」
  # asks (Issue #367). It warns only, until ADR 0006 「機械での確かめ」 makes
  # it fail. Pull requests only; a push to main has no base to compare with.
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checkout is the pull request merged into the base branch; its
      # first parent (HEAD^1) is the base it was merged into, so the two
      # differ by the pull request's changes only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Downloads the pinned oasdiff and checks its SHA-256 first.
      - name: Compare the contract with the base
        run: pnpm contract:breaking --base HEAD^1 --warn-only
