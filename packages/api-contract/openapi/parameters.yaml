# Parameters that many operations share.

# Every write carries one (ADR 0006 冪等キー). Reads do not.
IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: true
  description: >-
    Names this write, so that sending it again is safe (the IETF draft
    draft-ietf-httpapi-idempotency-key-header-07). A new UUID for each write the person makes,
    the same one when the same write is sent again. A Structured Field
    String (RFC 9651): the UUID in double quotes; parameters after it are
    ignored. Within 24 hours of the
    first, the same key with the same request answers what the first one
    answered, without doing it again; with another request (method, path,
    query or body), 422 `/problems/idempotency-key-reused`. Only a write
    that was saved is kept: one that was refused, or changed nothing, runs
    again.
  schema: { $ref: './schemas/common.yaml#/IdempotencyKey' }

# A write that replaces a record's values names the version it was made
# from (ADR 0006 記録ごとの版). State transitions do not.
IfMatchHeader:
  name: If-Match
  in: header
  required: true
  description: >-
    The `etag` of the record as read before the write was made (RFC 9110
    §13.1.1). When the record has changed since, the write is not made and
    the answer is 412 `/problems/precondition-failed`; without it, 428
    `/problems/precondition-required`. A write sent again with its
    Idempotency-Key answers what it answered first, before this is
    compared.
  schema: { $ref: './schemas/common.yaml#/EntityTagList' }
# A write that makes the record when there is none (a Goal, a Task's rule)
# has one of the two: `If-Match` when it was made from a record,
# `If-None-Match: *` when it was made from none.
OptionalIfMatchHeader:
  name: If-Match
  in: header
  required: false
  description: >-
    The `etag` of the record as read before the write was made, when there
    was one (RFC 9110 §13.1.1). One of `If-Match` and `If-None-Match` is
    required (428 `/problems/precondition-required` without either); 412
    `/problems/precondition-failed` when the record has changed since, or
    is gone.
  schema: { $ref: './schemas/common.yaml#/EntityTagList' }
IfNoneMatchHeader:
  name: If-None-Match
  in: header
  required: false
  description: >-
    `*` when the write was made from no record (RFC 9110 §13.1.2): 412
    `/problems/precondition-failed` when one has been made since (on
    another device), instead of writing over it.
  schema: { $ref: './schemas/common.yaml#/AnyEntityTag' }
