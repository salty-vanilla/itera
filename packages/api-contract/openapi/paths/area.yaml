# Area (領域). The paths of a resource and its methods (ADR 0006 経路の形):
# a write is one operation of packages/application or, where a path takes
# several, the one its body names (@itera/api-contract/requests).

areas:
  get:
    operationId: listAreas
    tags: [Reads]
    summary: The Areas to edit, in the person's order
    description: Archived ones too (`areaList`).
    responses:
      '200':
        description: The Areas.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  type: array
                  items: { $ref: '../schemas/views.yaml#/EditableArea' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/UserNotSetUp' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  post:
    operationId: createArea
    tags: [Area]
    summary: Make an Area
    description: >-
      Last in the order, in the next color (the operation decides both).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              properties:
                areaId: { $ref: '../schemas/common.yaml#/AreaId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

area:
  patch:
    operationId: updateArea
    tags: [Area]
    summary: Rename, archive or restore an Area
    description: >-
      One change a request: `name` renames it (renameArea); `archived` archives it (true, archiveArea) or brings it back (false, restoreArea).
    parameters:
      - name: areaId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/AreaId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [name]
                properties:
                  name: { type: string }
              - type: object
                additionalProperties: false
                required: [archived]
                properties:
                  archived: { type: boolean }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
