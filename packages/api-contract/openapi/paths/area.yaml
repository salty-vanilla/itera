# Area (領域): its operations. Each operation is named in packages/application
# operations.ts and is a POST of its input (ADR 0006).

createArea:
  post:
    operationId: createArea
    tags: [Area]
    summary: Make an Area
    description: >-
      Last in the order, in the next color (the operation decides both).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string }
    responses:
      '200':
        description: Done. What the operation made or decided.
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              properties:
                areaId: { $ref: '../schemas/common.yaml#/AreaId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

renameArea:
  post:
    operationId: renameArea
    tags: [Area]
    summary: Rename an Area
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [areaId, name]
            properties:
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
              name: { type: string }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

archiveArea:
  post:
    operationId: archiveArea
    tags: [Area]
    summary: Archive an Area
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [areaId]
            properties:
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

restoreArea:
  post:
    operationId: restoreArea
    tags: [Area]
    summary: Bring an archived Area back
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [areaId]
            properties:
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
