# Retro: its operations. Each operation is named in packages/application
# operations.ts and is a POST of its input (ADR 0006).

assessGoal:
  post:
    operationId: assessGoal
    tags: [Retro]
    summary: Assess an Area's Goal
    description: >-
      `null` clears the assessment.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [areaId, assessment]
            properties:
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
              assessment:
                oneOf:
                  - { $ref: '../schemas/records.yaml#/SelfAssessment' }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

