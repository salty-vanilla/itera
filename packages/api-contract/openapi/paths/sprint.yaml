# Sprint, and what is in it (its Goals, SprintTasks, included occurrences, today's choices, actual time, interrupts). The paths of a resource and its methods (ADR 0006 経路の形):
# nouns of the domain, a state change a verb after the resource. A write
# is one operation of packages/application or, where a path takes several,
# the one its body names (@itera/api-contract/requests).

sprints:
  get:
    operationId: listSprints
    tags: [Reads]
    summary: "The person's Sprints, in order"
    description: >-
      Each with its number (F25), an attribute: `number` finds the one with it.
    parameters:
      - name: number
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: The read.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  type: array
                  items: { $ref: '../schemas/views.yaml#/SprintItem' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/UserNotSetUp' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  post:
    operationId: beginPlanning
    tags: [Sprint]
    summary: '計画を始める: make the next Sprint'
    description: >-
      For the next week not confirmed yet; the domain decides when it starts.
    parameters:
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [sprintId]
              properties:
                sprintId: { $ref: '../schemas/common.yaml#/SprintId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

sprint:
  get:
    operationId: getSprint
    tags: [Reads]
    summary: A Sprint
    description: >-
      While planned, its plan (`apply-criterion` previews the active criterion; nothing is written); once confirmed, how it went.
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: apply-criterion
        in: query
        required: false
        description: >-
          Left out, the criterion is not applied.
        schema: { type: boolean }
    responses:
      '200':
        description: The read.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view: { $ref: '../schemas/views.yaml#/SprintView' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/UserNotSetUp' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  patch:
    operationId: setAvailableHours
    tags: [Sprint]
    summary: "Set the week's available hours"
    description: >-
      While planned, or after 確定 (the planned hours stay). `null` clears them.
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
      - $ref: '../parameters.yaml#/IfMatchHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [availableHours]
            properties:
              availableHours:
                oneOf:
                  - { type: number }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '412': { $ref: '../responses.yaml#/PreconditionFailed' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '428': { $ref: '../responses.yaml#/PreconditionRequired' }
      '500': { $ref: '../responses.yaml#/ServerError' }

sprintConfirm:
  post:
    operationId: confirmSprint
    tags: [Sprint]
    summary: '確定: start the Sprint'
    description: >-
      The plan is fixed (planSnapshot) with or without the active criterion.
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [applyCriterion]
            properties:
              applyCriterion: { type: boolean }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

sprintGoal:
  patch:
    operationId: updateGoal
    tags: [Sprint]
    summary: "Write an Area's Goal, or assess it"
    description: >-
      One change a request: `text` (setGoal, while planned or after 確定, F16) or `assessment`, `null` to clear it (assessGoal, in the Retro).
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: areaId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/AreaId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
      - $ref: '../parameters.yaml#/OptionalIfMatchHeader'
      - $ref: '../parameters.yaml#/IfNoneMatchHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: { type: string }
              - type: object
                additionalProperties: false
                required: [assessment]
                properties:
                  assessment:
                    oneOf:
                      - { $ref: '../schemas/records.yaml#/SelfAssessment' }
                      - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '412': { $ref: '../responses.yaml#/PreconditionFailed' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '428': { $ref: '../responses.yaml#/PreconditionRequired' }
      '500': { $ref: '../responses.yaml#/ServerError' }

sprintTasks:
  post:
    operationId: addToSprint
    tags: [Sprint]
    summary: Put Tasks in the Sprint
    description: >-
      Tasks (`taskIds`, addSprintTasks): drafts while planned, mid-Sprint additions with no day chosen while running (#155). Or a new Task (`title`, createAndChooseTask, while planned only). All or none.
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [taskIds]
                properties:
                  taskIds:
                    type: array
                    items: { $ref: '../schemas/common.yaml#/TaskId' }
              - type: object
                additionalProperties: false
                required: [title]
                properties:
                  title: { type: string }
                  areaId: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [sprintTaskIds]
              properties:
                sprintTaskIds:
                  description: The SprintTasks made, in the order of `taskIds`.
                  type: array
                  items: { $ref: '../schemas/common.yaml#/SprintTaskId' }
                taskId:
                  description: 'With `title`, the new Task.'
                  $ref: '../schemas/common.yaml#/TaskId'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: removeSprintTasks
    tags: [Sprint]
    summary: Take SprintTasks out of the Sprint, all or none
    description: >-
      Drafts while planned, mid-Sprint additions taken back while running (F40).
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: ids
        in: query
        required: true
        schema:
          type: array
          minItems: 1
          items: { $ref: '../schemas/common.yaml#/SprintTaskId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

