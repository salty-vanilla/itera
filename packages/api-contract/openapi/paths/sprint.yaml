      '500': { $ref: '../responses.yaml#/ServerError' }

interrupt:
  patch:
    operationId: editInterrupt
    tags: [Today]
    summary: 割り込みを編集
    description: >-
      Its note and minutes, both given: `null` minutes for none. The time stays (F38).
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
      - $ref: '../parameters.yaml#/IfMatchHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [text, minutes]
            properties:
              text: { type: string }
              minutes:
                oneOf:
                  - { type: number }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '412': { $ref: '../responses.yaml#/PreconditionFailed' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '428': { $ref: '../responses.yaml#/PreconditionRequired' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: deleteInterrupt
    tags: [Today]
    summary: 割り込みを消す (F38)
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  put:
    operationId: restoreInterrupt
    tags: [Today]
    summary: 元に戻す after 割り込みを消す
    description: >-
      The client sends back the note as the read gave it, its ID in the path: the same note returns to its place (ADR 0006). Only a note the person deleted from this Sprint comes back: any other ID, whether another person's or nobody's, is refused with the same 404. Refused with 422 if a note with that ID is there again, in this Sprint or in another of the person's, if it was noted later than now or on a day outside the Sprint (in the person's time zone), or if its text is empty.
    parameters:
      - name: sprintId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SprintId' }
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [at, text]
            properties:
              at: { $ref: '../schemas/common.yaml#/Instant' }
              text: { type: string }
              minutes: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
