# The reads: each is a GET of one read of packages/application (ADR 0006).
# The response is `{ clock, view }`: the clock the server read with (ADR
# 0005 時計) and the read's result, `null` where the read has nothing to show.
# Before reading, the server brings the records up to now (the end of a
# Sprint, the start of a day, #271); that write may meet another write.

getOverview:
  get:
    operationId: getOverview
    tags: [Reads]
    summary: What every screen's frame shows
    description: The navigation's counts, the current Sprints and the clock (`appOverview`).
    responses:
      '200':
        description: The overview.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view: { $ref: '../schemas/views.yaml#/AppOverview' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

listAreas:
  get:
    operationId: listAreas
    tags: [Reads]
    summary: The Areas to edit, in the person's order
    description: Archived ones too (`areaList`).
    responses:
      '200':
        description: The Areas.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  type: array
                  items: { $ref: '../schemas/views.yaml#/EditableArea' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getBacklog:
  get:
    operationId: getBacklog
    tags: [Reads]
    summary: The Backlog, filtered
    description: "`backlogData`. Without `view` it shows all; with `area`, that Area's Tasks."
    parameters:
      - name: view
        in: query
        required: false
        schema: { $ref: '../schemas/views.yaml#/BacklogSlice' }
      - name: area
        in: query
        required: false
        schema: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '200':
        description: The Backlog.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view: { $ref: '../schemas/views.yaml#/BacklogData' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getSprintChoice:
  get:
    operationId: getSprintChoice
    tags: [Reads]
    summary: The Sprint a screen opens, and those before and after it
    description: >-
      `sprintChoice` (#90): the Sprint asked for by number, else the current
      one for the screen. `null` for the Retro screen before the first
      Sprint.
    parameters:
      - name: screen
        in: query
        required: true
        schema:
          type: string
          enum: [sprint, retro]
      - name: sprint
        in: query
        required: false
        description: The Sprint's number (F25).
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: The choice.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/SprintChoice'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getPlanning:
  get:
    operationId: getPlanning
    tags: [Reads]
    summary: The Sprint being planned
    description: >-
      `planningData`. `applyCriterion` is the screen's choice at the Check
      whether to apply the active criterion (a preview; nothing is
      written). `null` when no Sprint is being planned.
    parameters:
      - name: applyCriterion
        in: query
        required: false
        description: Left out, the criterion is not applied.
        schema: { type: boolean }
    responses:
      '200':
        description: The Planning.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/PlanningData'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getRunning:
  get:
    operationId: getRunning
    tags: [Reads]
    summary: A confirmed Sprint's plan and how it went
    description: >-
      `runningData`: the Sprint with the number asked for, else the running
      one. `null` for a Sprint still being planned, a number with no
      Sprint, or no running Sprint.
    parameters:
      - name: sprint
        in: query
        required: false
        description: The Sprint's number (F25).
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: The Sprint.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/RunningData'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getToday:
  get:
    operationId: getToday
    tags: [Reads]
    summary: Today in the running Sprint
    description: '`todayData`. `null` when no Sprint is running.'
    responses:
      '200':
        description: Today.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/TodayData'
                    - type: 'null'
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getDay:
  get:
    operationId: getDay
    tags: [Reads]
    summary: A day other than today (read only)
    description: >-
      `dayData` (#90): a past day's records, or a future day's occurrences
      and deadlines. `null` for today, which `getToday` reads.
    parameters:
      - name: date
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/LocalDate' }
    responses:
      '200':
        description: The day.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/DayData'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getRetro:
  get:
    operationId: getRetro
    tags: [Reads]
    summary: A confirmed Sprint's Retro
    description: >-
      `retroData`: the Retro of the Sprint with the number asked for, once
      its Retro has started (in Review or closed; a closed one is read
      only), else of the Sprint in Review. `null` before its Retro starts,
      for a number with no Sprint, or with no Sprint in Review.
    parameters:
      - name: sprint
        in: query
        required: false
        description: The Sprint's number (F25).
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: The Retro.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/RetroData'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }

getNextPlanning:
  get:
    operationId: getNextPlanning
    tags: [Reads]
    summary: Where the next Planning starts
    description: '`nextPlanningOf`: the Sprint being planned, or where a new Planning would start.'
    responses:
      '200':
        description: The next Planning.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view: { $ref: '../schemas/views.yaml#/NextPlanning' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '500': { $ref: '../responses.yaml#/ServerError' }
