interrupts:
  post:
    operationId: noteInterrupt
    tags: [Today]
    summary: 割り込みを記録
    description: >-
      Nothing in Today changes (invariant 29).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string }
              minutes: { type: number }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [interruptNoteId]
              properties:
                interruptNoteId:
                  { $ref: '../schemas/common.yaml#/InterruptNoteId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
