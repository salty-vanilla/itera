# Today: the running Sprint's today. The paths of a resource and its methods (ADR 0006 経路の形):
# a write is one operation of packages/application or, where a path takes
# several, the one its body names (@itera/api-contract/operations).

selections:
  post:
    operationId: createDailySelection
    tags: [Today]
    summary: Choose for today
    description: >-
      A SprintTask (or an occurrence of it) of the running Sprint (`sprintTaskId`, chooseForToday), or a Task outside it, put in the Sprint too (`taskId`, 今日へ, addTaskToToday).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [sprintTaskId]
                properties:
                  sprintTaskId: { $ref: '../schemas/common.yaml#/SprintTaskId' }
                  occurrenceId: { $ref: '../schemas/common.yaml#/OccurrenceId' }
              - type: object
                additionalProperties: false
                required: [taskId]
                properties:
                  taskId: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [selectionId]
              properties:
                selectionId:
                  { $ref: '../schemas/common.yaml#/DailySelectionId' }
                sprintTaskId:
                  description: 'With `taskId`, its new SprintTask.'
                  $ref: '../schemas/common.yaml#/SprintTaskId'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

selectionStart:
  post:
    operationId: startSelection
    tags: [Today]
    summary: Start a choice for today
    parameters:
      - name: selectionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/DailySelectionId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
