      '500': { $ref: '../responses.yaml#/ServerError' }

interrupt:
  patch:
    operationId: editInterrupt
    tags: [Today]
    summary: 割り込みを編集
    description: >-
      Its note and minutes; the time stays (F38). Without `minutes`, it has none.
    parameters:
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string }
              minutes: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: deleteInterrupt
    tags: [Today]
    summary: 割り込みを消す (F38)
    parameters:
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  put:
    operationId: restoreInterrupt
    tags: [Today]
    summary: 元に戻す after 割り込みを消す
    description: >-
      The client sends back the note as the read gave it, its ID in the path: the same note returns to its place (ADR 0006). Refused if a note with that ID is there, or if it was noted later than now.
    parameters:
      - name: interruptNoteId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/InterruptNoteId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [at, text]
            properties:
              at: { $ref: '../schemas/common.yaml#/Instant' }
              text: { type: string }
              minutes: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
