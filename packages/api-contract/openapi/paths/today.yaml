# Today: its operations. Each operation is named in packages/application
# operations.ts and is a POST of its input (ADR 0006).

chooseForToday:
  post:
    operationId: chooseForToday
    tags: [Today]
    summary: Choose a SprintTask (or an occurrence of it) for today
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [sprintTaskId]
            properties:
              sprintTaskId: { $ref: '../schemas/common.yaml#/SprintTaskId' }
              occurrenceId: { $ref: '../schemas/common.yaml#/OccurrenceId' }
    responses:
      '200':
        description: Done. What the operation made or decided.
        content:
          application/json:
            schema:
              type: object
              required: [selectionId]
              properties:
                selectionId:
                  { $ref: '../schemas/common.yaml#/DailySelectionId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

startSelection:
  post:
    operationId: startSelection
    tags: [Today]
    summary: Start a choice for today
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [selectionId]
            properties:
              selectionId: { $ref: '../schemas/common.yaml#/DailySelectionId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

