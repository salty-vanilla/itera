# Task (Backlog and the detail): its operations. Each operation is named in packages/application
# operations.ts and is a POST of its input (ADR 0006).

createTask:
  post:
    operationId: createTask
    tags: [Task]
    summary: Quick Add in the Backlog
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: { type: string }
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '200':
        description: Done. What the operation made or decided.
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: { $ref: '../schemas/common.yaml#/TaskId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

saveTask:
  post:
    operationId: saveTask
    tags: [Task]
    summary: Save the detail's form
    description: >-
      The attributes and the Estimate, saved together.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [taskId, update]
            properties:
              taskId: { $ref: '../schemas/common.yaml#/TaskId' }
              update: { $ref: '../schemas/records.yaml#/TaskAttributeUpdate' }
              estimate:
                description: Hours. `null` clears the Estimate; left out, it stays.
                oneOf:
                  - { type: number }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

adoptSuggestion:
  post:
    operationId: adoptSuggestion
    tags: [Task]
    summary: 採用 a suggestion at one of its bounds
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [taskId, suggestionId, bound]
            properties:
              taskId: { $ref: '../schemas/common.yaml#/TaskId' }
              suggestionId:
                { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
              bound: { $ref: '../schemas/records.yaml#/SuggestionBound' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

undoAdoption:
  post:
    operationId: undoAdoption
    tags: [Task]
    summary: Take back 採用
    description: >-
      The Task keeps only its current Estimate, so the client sends the one it had before (`null` for none), from the read it made before adopting.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [taskId, suggestionId, previous]
            properties:
              taskId: { $ref: '../schemas/common.yaml#/TaskId' }
              suggestionId:
                { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
              previous:
                oneOf:
                  - { $ref: '../schemas/records.yaml#/Estimate' }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

adoptEditedSuggestion:
  post:
    operationId: adoptEditedSuggestion
    tags: [Task]
    summary: '直して使う: adopt a suggestion with the hours edited (F31)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [taskId, suggestionId, hours]
            properties:
              taskId: { $ref: '../schemas/common.yaml#/TaskId' }
              suggestionId:
                { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
              hours: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

