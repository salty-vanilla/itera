# Task (the Backlog and its detail). The paths of a resource and its methods (ADR 0006 経路の形):
# a write is one operation of packages/application or, where a path takes
# several, the one its body names (@itera/api-contract/operations).

tasks:
  post:
    operationId: quickAddTask
    tags: [Task]
    summary: 'Quick Add: make a Task'
    description: >-
      Without `addTo`, in the Backlog (createTask). `planning` also chooses it for the Sprint being planned (createAndChooseTask); `today` puts it in the running Sprint and chooses it for today (createTaskForToday).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: { type: string }
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
              addTo: { type: string, enum: [planning, today] }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: { $ref: '../schemas/common.yaml#/TaskId' }
                sprintTaskId:
                  description: With `addTo`.
                  $ref: '../schemas/common.yaml#/SprintTaskId'
                selectionId:
                  description: 'With `addTo` today.'
                  $ref: '../schemas/common.yaml#/DailySelectionId'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

task:
  patch:
    operationId: updateTask
    tags: [Task]
    summary: "Save a Task's detail, or archive or restore it"
    description: >-
      One change a request: the attributes and the Estimate, saved together (saveTask), or `archived` alone: true archives it (archiveTask), false brings it back (restoreTask).
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - description: >-
                  The detail's form (saveTask): a property left out stays; `null` clears an optional one.
                type: object
                additionalProperties: false
                properties:
                  title: { type: string }
                  description: { type: string }
                  areaId:
                    oneOf:
                      - { $ref: '../schemas/common.yaml#/AreaId' }
                      - type: 'null'
                  due:
                    oneOf:
                      - { $ref: '../schemas/common.yaml#/LocalDate' }
                      - type: 'null'
                  priority: { $ref: '../schemas/records.yaml#/TaskPriority' }
                  timeBasis: { $ref: '../schemas/records.yaml#/TimeBasis' }
                  estimate:
                    description: Hours. `null` clears the Estimate.
                    oneOf:
                      - { type: number }
                      - type: 'null'
              - type: object
                additionalProperties: false
                required: [archived]
                properties:
                  archived: { type: boolean }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

taskCompletion:
  put:
    operationId: completeTask
    tags: [Task]
    summary: 完了にする in the Backlog
    description: >-
      With today's selection when the Task is in the running Sprint.
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: undoCompleteTask
    tags: [Task]
    summary: Take back 完了にする in the Backlog
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

taskRecurrence:
  put:
    operationId: setRecurrence
    tags: [Task]
    summary: "Set or change a Task's recurrence"
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [pattern]
            properties:
              pattern: { $ref: '../schemas/records.yaml#/RecurrencePattern' }
    responses:
      '200':
        description: Done. What the operation decided.
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom:
                  description: >-
                    The day the change takes effect (the next Sprint not
                    confirmed yet, F1, F7, F15). Left out when the pattern
                    was already the rule's.
                  $ref: '../schemas/common.yaml#/LocalDate'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: endRecurrence
    tags: [Task]
    summary: "End a Task's recurrence"
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '200':
        description: Done. What the operation decided.
        content:
          application/json:
            schema:
              type: object
              required: [removed]
              properties:
                removed:
                  description: >-
                    The rule had no occurrence yet and was deleted (F41):
                    the Task is one-off again. Otherwise it ends before the
                    next Sprint not confirmed yet.
                  type: boolean
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

subtasks:
  post:
    operationId: addSubtask
    tags: [Task]
    summary: Add a Subtask
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: { type: string }
              hours: { type: number }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [subtaskId]
              properties:
                subtaskId: { $ref: '../schemas/common.yaml#/SubtaskId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

subtask:
  patch:
    operationId: updateSubtask
    tags: [Task]
    summary: Check a Subtask, or set its hours
    description: >-
      One change a request: `done` checks or unchecks it (setSubtaskDone); `hours` sets its hours, `null` clears them (setSubtaskEstimate).
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: subtaskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SubtaskId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [done]
                properties:
                  done: { type: boolean }
              - type: object
                additionalProperties: false
                required: [hours]
                properties:
                  hours:
                    oneOf:
                      - { type: number }
                      - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionAdopt:
  post:
    operationId: adoptEstimateSuggestion
    tags: [Task]
    summary: 採用 a suggestion
    description: >-
      At one of its bounds (`bound`, adoptSuggestion), or with the hours edited (`hours`, 直して使う, adoptEditedSuggestion, F31).
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [bound]
                properties:
                  bound: { $ref: '../schemas/records.yaml#/SuggestionBound' }
              - type: object
                additionalProperties: false
                required: [hours]
                properties:
                  hours: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionUndoAdoption:
  post:
    operationId: undoAdoption
    tags: [Task]
    summary: Take back 採用
    description: >-
      The Task keeps only its current Estimate, so the client sends the one it had before (`null` for none), from the read it made before adopting.
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [previous]
            properties:
              previous:
                oneOf:
                  - { $ref: '../schemas/records.yaml#/Estimate' }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionReject:
  post:
    operationId: rejectSuggestion
    tags: [Task]
    summary: Reject a suggestion
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionUndoRejection:
  post:
    operationId: undoRejection
    tags: [Task]
    summary: Take back a rejection
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
