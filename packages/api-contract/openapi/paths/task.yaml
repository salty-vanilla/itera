subtask:
  patch:
    operationId: updateSubtask
    tags: [Task]
    summary: Check a Subtask, or set its hours
    description: >-
      One change a request: `done` (setSubtaskDone, a check with no rule) or `hours`, `null` to clear them (setSubtaskEstimate).
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: subtaskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/SubtaskId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
      - $ref: '../parameters.yaml#/IfMatchHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [done]
                properties:
                  done: { type: boolean }
              - type: object
                additionalProperties: false
                required: [hours]
                properties:
                  hours:
                    oneOf:
                      - { type: number }
                      - type: 'null'
    responses:
      '204':
        description: Done.
        headers:
          ETag: { $ref: '../headers.yaml#/RecordETag' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '412': { $ref: '../responses.yaml#/PreconditionFailed' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '428': { $ref: '../responses.yaml#/PreconditionRequired' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionAdopt:
  post:
    operationId: adoptEstimateSuggestion
    tags: [Task]
    summary: 採用 an estimate suggestion
    description: >-
      At one of its bounds (`bound`, adoptSuggestion), or with the hours edited (`hours`, 直して使う, adoptEditedSuggestion, F31).
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [bound]
                properties:
                  bound: { $ref: '../schemas/records.yaml#/SuggestionBound' }
              - type: object
                additionalProperties: false
                required: [hours]
                properties:
                  hours: { type: number }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

suggestionUndoAdopt:
  post:
    operationId: undoAdoption
    tags: [Task]
    summary: Take back 採用
    description: >-
      The Task keeps only its current Estimate, so the client sends the one it had before (`null` for none), from the read it made before adopting.
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
      - name: suggestionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/EstimateSuggestionId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [previous]
            properties:
              previous:
                oneOf:
                  - { $ref: '../schemas/records.yaml#/Estimate' }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

