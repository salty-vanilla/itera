# Planning criterion (計画基準). The paths of a resource and its methods (ADR 0006 経路の形):
# nouns of the domain, a state change a verb after the resource. A write
# is one operation of packages/application or, where a path takes several,
# the one its body names (@itera/api-contract/requests).

planningCriteria:
  post:
    operationId: draftCriterion
    tags: [PlanningCriterion]
    summary: '基準にもする: draft a criterion'
    description: >-
      From the improvement of the Sprint in Review (`sourceSprintId`).
    parameters:
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [sourceSprintId, policy]
            properties:
              sourceSprintId: { $ref: '../schemas/common.yaml#/SprintId' }
              policy: { $ref: '../schemas/records.yaml#/CriterionPolicy' }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [criterionId]
              properties:
                criterionId:
                  { $ref: '../schemas/common.yaml#/PlanningCriterionId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

planningCriterion:
  patch:
    operationId: setDraftPolicy
    tags: [PlanningCriterion]
    summary: "Change a draft criterion's policy"
    parameters:
      - name: criterionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/PlanningCriterionId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [policy]
            properties:
              policy: { $ref: '../schemas/records.yaml#/CriterionPolicy' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: dropCriterionDraft
    tags: [PlanningCriterion]
    summary: Drop a draft criterion
    parameters:
      - name: criterionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/PlanningCriterionId' }
      - $ref: '../parameters.yaml#/IdempotencyKeyHeader'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
