# The running Sprint, after 確定. The paths of a resource and its methods (ADR 0006 経路の形):
# a write is one operation of packages/application or, where a path takes
# several, the one its body names (@itera/api-contract/operations).

running:
  get:
    operationId: getRunning
    tags: [Reads]
    summary: A confirmed Sprint's plan and how it went
    description: >-
      `runningData`: the Sprint with the number asked for, else the running
      one. `null` for a Sprint still being planned, a number with no
      Sprint, or no running Sprint.
    parameters:
      - name: sprint
        in: query
        required: false
        description: The Sprint's number (F25).
        schema: { type: integer, minimum: 1 }
    responses:
      '200':
        description: The Sprint.
        content:
          application/json:
            schema:
              type: object
              required: [clock, view]
              properties:
                clock: { $ref: '../schemas/common.yaml#/Clock' }
                view:
                  oneOf:
                    - $ref: '../schemas/views.yaml#/RunningData'
                    - type: 'null'
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '422': { $ref: '../responses.yaml#/UserNotSetUp' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  patch:
    operationId: setRunningAvailableHours
    tags: [Running]
    summary: "Change the week's available hours while the Sprint runs"
    description: >-
      `null` clears them.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [availableHours]
            properties:
              availableHours:
                oneOf:
                  - { type: number }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

runningGoal:
  put:
    operationId: setRunningGoal
    tags: [Running]
    summary: "Change an Area's Goal while the Sprint runs"
    parameters:
      - name: areaId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/AreaId' }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

runningTask:
  put:
    operationId: addTaskToWeek
    tags: [Running]
    summary: '今週へ for a Task outside the running Sprint (#155)'
    description: >-
      The path takes the Task's ID: a Task is in the running Sprint once.
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '201':
        description: Made. The IDs of what the operation made.
        content:
          application/json:
            schema:
              type: object
              required: [sprintTaskId]
              properties:
                sprintTaskId: { $ref: '../schemas/common.yaml#/SprintTaskId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

  delete:
    operationId: undoAddTaskToWeek
    tags: [Running]
    summary: Take back 今週へ
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/TaskId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

runningSelectionUndo:
  post:
    operationId: undoPastDay
    tags: [Running]
    summary: "Take back a past day's completion or skip (#53)"
    parameters:
      - name: selectionId
        in: path
        required: true
        schema: { $ref: '../schemas/common.yaml#/DailySelectionId' }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }
