# Planning the Sprint: its operations. Each operation is named in packages/application
# operations.ts and is a POST of its input (ADR 0006).

chooseTasks:
  post:
    operationId: chooseTasks
    tags: [Planning]
    summary: Choose Tasks for the Sprint being planned
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [taskIds]
            properties:
              taskIds:
                {
                  type: array,
                  items: { $ref: '../schemas/common.yaml#/TaskId' },
                }
    responses:
      '200':
        description: Done. What the operation made or decided.
        content:
          application/json:
            schema:
              type: object
              required: [sprintTaskIds]
              properties:
                sprintTaskIds:
                  description: >-
                    The draft SprintTasks, in the order of `taskIds`.
                  type: array
                  items: { $ref: '../schemas/common.yaml#/SprintTaskId' }
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

unchooseTasks:
  post:
    operationId: unchooseTasks
    tags: [Planning]
    summary: Take SprintTasks out of the plan
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [sprintTaskIds]
            properties:
              sprintTaskIds:
                {
                  type: array,
                  items: { $ref: '../schemas/common.yaml#/SprintTaskId' },
                }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
      '403': { $ref: '../responses.yaml#/ForbiddenOrigin' }
      '404': { $ref: '../responses.yaml#/NotFound' }
      '409': { $ref: '../responses.yaml#/RevisionConflict' }
      '413': { $ref: '../responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../responses.yaml#/RuleViolation' }
      '500': { $ref: '../responses.yaml#/ServerError' }

