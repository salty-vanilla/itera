      '500': { $ref: '../responses.yaml#/ServerError' }

confirmSprint:
  post:
    operationId: confirmSprint
    tags: [Planning]
    summary: '確定: start the Sprint'
    description: >-
      The plan is fixed (planSnapshot) with or without the active criterion.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [applyCriterion]
            properties:
              applyCriterion: { type: boolean }
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
