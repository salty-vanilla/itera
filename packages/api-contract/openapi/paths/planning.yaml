createAndChooseTask:
  post:
    operationId: createAndChooseTask
    tags: [Planning]
    summary: 'Planning で追加: a new Task, chosen at once'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title: { type: string }
              areaId: { $ref: '../schemas/common.yaml#/AreaId' }
    responses:
      '200':
        description: Done. What the operation made or decided.
        content:
          application/json:
            schema:
              type: object
              required: [taskId, sprintTaskId]
              properties:
                taskId: { $ref: '../schemas/common.yaml#/TaskId' }
