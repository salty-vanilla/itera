setPlanningAvailableHours:
  post:
    operationId: setPlanningAvailableHours
    tags: [Planning]
    summary: Set the week's available hours while planning
    description: >-
      `null` clears them.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [hours]
            properties:
              hours:
                oneOf:
                  - { type: number }
                  - type: 'null'
    responses:
      '204':
        description: Done.
      '400': { $ref: '../responses.yaml#/BadRequest' }
      '401': { $ref: '../responses.yaml#/Unauthenticated' }
