  /sprints/{sprintId}:
    $ref: './paths/sprint.yaml#/sprint'
  /sprints/{sprintId}/confirm:
    $ref: './paths/sprint.yaml#/sprintConfirm'
  /sprints/{sprintId}/goals/{areaId}:
    $ref: './paths/sprint.yaml#/sprintGoal'
  /sprints/{sprintId}/sprint-tasks:
