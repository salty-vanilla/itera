openapi: 3.1.1
info:
  title: Itera API
  version: 0.1.0
  summary: The contract between Itera's clients and its API (ADR 0006).
  description: >-
    Spec-first: this file and the files it refers to are the source of
    truth. The API (services/api) and the clients (apps/web, later iOS and
    Android) take their types, schemas and clients from it. The rules are
    packages/domain's and only the server runs them; an operation is a name
    and its input, and a read is a GET (ADR 0005 API への移行).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: The same origin as the web app (ADR 0004 Web と API の配信).
security:
  - session: []
tags:
  - name: Reads
    description: The reads of packages/application.
  - name: Area
    description: 領域.
  - name: Task
    description: The Backlog and a Task's detail.
  - name: Planning
    description: Planning the Sprint, before 確定.
  - name: Today
    description: Today in the running Sprint.
  - name: Running
    description: The Sprint after 確定.
  - name: Retro
    description: The Retro of a Sprint in Review.
