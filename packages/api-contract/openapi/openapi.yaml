openapi: 3.1.1
info:
  title: Itera API
  version: 0.7.0
  summary: The contract between Itera's clients and its API (ADR 0006).
  description: >-
    Spec-first: this file and the files it refers to are the source of
    truth. The API (services/api) and the clients (apps/web, later iOS and
    Android) take their types, schemas and clients from it. The rules are
    packages/domain's and only the server runs them; an operation is a name
    and its input, carried by a resource's path and an HTTP method (ADR 0005
    API への移行, ADR 0006 経路の形).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: The same origin as the web app (ADR 0004 Web と API の配信).
security:
  - session: []
tags:
  - name: Me
    description: The signed-in person, their settings and the Sprints they have now.
  - name: Reads
    description: The reads of the resources.
  - name: Area
    description: 領域.
  - name: Task
    description: A Task and what it has (Subtasks, its recurrence, estimate suggestions).
  - name: Sprint
    description: A Sprint and what is in it (Goals, SprintTasks, occurrences, actual time).
  - name: Today
    description: A day's choices and interrupts in the running Sprint.
  - name: Retro
    description: A Sprint's Retro.
  - name: PlanningCriterion
    description: 計画基準.
paths:
  /me:
    $ref: './paths/me.yaml#/me'
  /me/settings:
    $ref: './paths/me.yaml#/meSettings'
  /areas:
    $ref: './paths/area.yaml#/areas'
  /areas/{areaId}:
    $ref: './paths/area.yaml#/area'
  /areas/{areaId}/archive:
    $ref: './paths/area.yaml#/areaArchive'
  /areas/{areaId}/restore:
    $ref: './paths/area.yaml#/areaRestore'
  /tasks:
    $ref: './paths/task.yaml#/tasks'
  /tasks/{taskId}:
    $ref: './paths/task.yaml#/task'
  /tasks/{taskId}/archive:
    $ref: './paths/task.yaml#/taskArchive'
  /tasks/{taskId}/restore:
