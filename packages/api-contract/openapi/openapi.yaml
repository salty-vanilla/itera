openapi: 3.1.1
info:
  title: Itera API
  version: 0.2.0
  summary: The contract between Itera's clients and its API (ADR 0006).
  description: >-
    Spec-first: this file and the files it refers to are the source of
    truth. The API (services/api) and the clients (apps/web, later iOS and
    Android) take their types, schemas and clients from it. The rules are
    packages/domain's and only the server runs them; an operation is a name
    and its input, carried by a path and an HTTP method (ADR 0005 API への移行,
    ADR 0006 経路の形).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: The same origin as the web app (ADR 0004 Web と API の配信).
security:
  - session: []
tags:
  - name: Me
    description: The signed-in person.
  - name: Reads
    description: The reads of packages/application.
  - name: Area
    description: 領域.
  - name: Task
    description: The Backlog and a Task's detail.
  - name: Planning
    description: Planning the Sprint, before 確定.
  - name: Today
    description: Today in the running Sprint.
  - name: Running
    description: The Sprint after 確定.
  - name: Retro
    description: The Retro of a Sprint in Review.
paths:
  /me:
    $ref: './paths/me.yaml#/getMe'
  /overview:
    $ref: './paths/reads.yaml#/getOverview'
  /backlog:
    $ref: './paths/reads.yaml#/getBacklog'
  /sprint-choice:
    $ref: './paths/reads.yaml#/getSprintChoice'
  /today:
    $ref: './paths/reads.yaml#/getToday'
  /days/{date}:
    $ref: './paths/reads.yaml#/getDay'
  /next-planning:
    $ref: './paths/reads.yaml#/getNextPlanning'
  /areas:
    $ref: './paths/area.yaml#/areas'
  /areas/{areaId}:
    $ref: './paths/area.yaml#/area'
  /tasks:
    $ref: './paths/task.yaml#/tasks'
  /tasks/{taskId}:
    $ref: './paths/task.yaml#/task'
  /tasks/{taskId}/completion:
    $ref: './paths/task.yaml#/taskCompletion'
  /tasks/{taskId}/recurrence:
    $ref: './paths/task.yaml#/taskRecurrence'
  /tasks/{taskId}/subtasks:
    $ref: './paths/task.yaml#/subtasks'
  /tasks/{taskId}/subtasks/{subtaskId}:
    $ref: './paths/task.yaml#/subtask'
  /tasks/{taskId}/suggestions/{suggestionId}/adopt:
    $ref: './paths/task.yaml#/suggestionAdopt'
  /tasks/{taskId}/suggestions/{suggestionId}/undo-adoption:
    $ref: './paths/task.yaml#/suggestionUndoAdoption'
  /tasks/{taskId}/suggestions/{suggestionId}/reject:
    $ref: './paths/task.yaml#/suggestionReject'
  /tasks/{taskId}/suggestions/{suggestionId}/undo-rejection:
    $ref: './paths/task.yaml#/suggestionUndoRejection'
  /planning:
    $ref: './paths/planning.yaml#/planning'
  /planning/confirm:
    $ref: './paths/planning.yaml#/planningConfirm'
  /planning/goals/{areaId}:
    $ref: './paths/planning.yaml#/planningGoal'
  /planning/tasks:
    $ref: './paths/planning.yaml#/planningTasks'
  /planning/tasks/{sprintTaskId}:
    $ref: './paths/planning.yaml#/planningTask'
  /planning/tasks/{sprintTaskId}/exclude-occurrences:
    $ref: './paths/planning.yaml#/planningTaskExcludeOccurrences'
  /planning/occurrences/include:
    $ref: './paths/planning.yaml#/planningOccurrencesInclude'
  /planning/occurrences/{occurrenceId}:
    $ref: './paths/planning.yaml#/planningOccurrence'
  /today/selections:
    $ref: './paths/today.yaml#/selections'
  /today/selections/{selectionId}/start:
    $ref: './paths/today.yaml#/selectionStart'
  /today/selections/{selectionId}/pause:
    $ref: './paths/today.yaml#/selectionPause'
  /today/selections/{selectionId}/defer:
    $ref: './paths/today.yaml#/selectionDefer'
  /today/selections/{selectionId}/remove:
    $ref: './paths/today.yaml#/selectionRemove'
  /today/selections/{selectionId}/complete:
    $ref: './paths/today.yaml#/selectionComplete'
  /today/selections/{selectionId}/skip:
    $ref: './paths/today.yaml#/selectionSkip'
  /today/selections/{selectionId}/undo-close:
    $ref: './paths/today.yaml#/selectionUndoClose'
  /today/selections/{selectionId}/undo-complete:
    $ref: './paths/today.yaml#/selectionUndoComplete'
  /today/selections/{selectionId}/undo-skip:
    $ref: './paths/today.yaml#/selectionUndoSkip'
  /today/selections/{selectionId}/actuals:
    $ref: './paths/today.yaml#/selectionActuals'
  /today/interrupts:
    $ref: './paths/today.yaml#/interrupts'
  /today/interrupts/{interruptNoteId}:
    $ref: './paths/today.yaml#/interrupt'
  /running:
    $ref: './paths/running.yaml#/running'
  /running/goals/{areaId}:
    $ref: './paths/running.yaml#/runningGoal'
  /running/tasks/{taskId}:
    $ref: './paths/running.yaml#/runningTask'
  /running/selections/{selectionId}/undo:
    $ref: './paths/running.yaml#/runningSelectionUndo'
  /retro:
    $ref: './paths/retro.yaml#/retro'
  /retro/begin:
    $ref: './paths/retro.yaml#/retroBegin'
  /retro/complete:
    $ref: './paths/retro.yaml#/retroComplete'
  /retro/goals/{areaId}:
    $ref: './paths/retro.yaml#/retroGoal'
  /retro/pins/{pin}:
    $ref: './paths/retro.yaml#/retroPin'
  /retro/draft-criterion:
    $ref: './paths/retro.yaml#/draftCriterion'
  /retro/actuals:
    $ref: './paths/retro.yaml#/retroActuals'
components:
  securitySchemes:
    session:
      description: >-
        Better Auth's session cookie, set by signing in (/api/auth/*, not in
        this contract). Over HTTPS its name has the `__Secure-` prefix. A
        browser sends it by itself; there is no bearer token.
      type: apiKey
      in: cookie
      name: better-auth.session_token
