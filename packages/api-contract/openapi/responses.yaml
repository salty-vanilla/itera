# The error responses, one per status (ADR 0006 エラー).
BadRequest:
  description: The request does not match the contract.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/ValidationError' }
Unauthenticated:
  description: No valid session.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/UnauthenticatedError' }
ForbiddenOrigin:
  description: A write whose Origin is not the app's own.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/ForbiddenOriginError' }
NotFound:
  description: A record the request names is not among the person's records.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/NotFoundError' }
RevisionConflict:
  description: Another write came first; this one was not made.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/RevisionConflictError' }
PayloadTooLarge:
  description: The body is larger than the API takes.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/PayloadTooLargeError' }
RuleViolation:
  description: >-
    The domain refused the operation, or the person has no settings yet.
  content:
    application/problem+json:
      schema:
        oneOf:
          - { $ref: './schemas/common.yaml#/RuleViolationError' }
          - { $ref: './schemas/common.yaml#/UserNotSetUpError' }
UserNotSetUp:
  description: The person has no settings yet.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/UserNotSetUpError' }
ServerError:
  description: An unexpected failure on the server.
  content:
    application/problem+json:
      schema: { $ref: './schemas/common.yaml#/InternalError' }
