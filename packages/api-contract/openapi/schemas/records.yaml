# The records of packages/domain, in the same shape (ADR 0006 記録の DTO).
# An optional property is left out when it has no value; it is never null.
# A record whose values a write replaces (a PATCH) has an output-only
# `etag`, its version, which that write sends back (ADR 0006 記録ごとの版).
# Value rules (positive hours, a non-empty title, state transitions) are the
# domain's: the contract describes the shape only.

# ------------------------------------------------------------------ User
UserSettings:
  description: >-
    The person's settings: the domain's User without its ID. The week's
    first day decides a Sprint's dates.
  type: object
  required: [displayName, timeZone, weekStartsOn]
  properties:
    displayName: { type: string }
    timeZone: { $ref: './common.yaml#/TimeZone' }
    weekStartsOn: { $ref: './common.yaml#/DayOfWeek' }

# ------------------------------------------------------------------ Area
AreaColor:
  description: Closed enum. The Area's color, `area-1` to `area-7` (DESIGN.md).
  type: integer
  enum: [1, 2, 3, 4, 5, 6, 7]

# ------------------------------------------------------------------ Task
TaskLifecycle:
  description: Closed enum.
  type: string
  enum: [active, completed, archived]
TaskPriority:
  description: Closed enum.
  type: string
  enum: [high, normal, low]
TimeBasis:
  description: Closed enum. Whether the Task's time is its own Estimate or its Subtasks' sum.
  type: string
  enum: [task, subtasks]
TaskCreatedVia:
  description: Closed enum.
  type: string
  enum: [backlog, today, agent]
SuggestionBound:
  description: Closed enum. Which end of a suggestion's range is used (lo, the middle, hi).
  type: string
  enum: [lo, mid, hi]
Subtask:
  type: object
  required: [id, title, done, etag]
  properties:
    id: { $ref: './common.yaml#/SubtaskId' }
    title: { type: string }
    estimate:
      description: Hours.
      type: number
    done: { type: boolean }
    doneAt: { $ref: './common.yaml#/Instant' }
    etag: { $ref: './common.yaml#/ETag' }
EstimateSource:
  oneOf:
    - title: ManualEstimateSource
      type: object
      required: [kind]
      properties:
        kind: { const: manual }
    - title: AdoptedEstimateSource
      description: 採用 of a suggestion's bound.
      type: object
      required: [kind, suggestionId, bound]
      properties:
        kind: { const: adopted }
        suggestionId: { $ref: './common.yaml#/EstimateSuggestionId' }
        bound: { $ref: '#/SuggestionBound' }
    - title: EditedEstimateSource
      description: 直して使う (F31), the person's own hours from a suggestion.
      type: object
      required: [kind, suggestionId]
      properties:
        kind: { const: edited }
        suggestionId: { $ref: './common.yaml#/EstimateSuggestionId' }
Estimate:
  type: object
  required: [hours, setAt, source]
  properties:
    hours: { type: number }
    setAt: { $ref: './common.yaml#/Instant' }
    source: { $ref: '#/EstimateSource' }
SuggestionState:
  description: Closed enum.
  type: string
  enum: [presented, adopted, rejected, replaced]
EstimateSuggestion:
  type: object
  required: [id, lo, hi, rationale, uncertainties, createdAt, state]
  properties:
    id: { $ref: './common.yaml#/EstimateSuggestionId' }
    lo: { type: number }
    hi: { type: number }
    rationale: { type: string }
    uncertainties:
      type: array
      items: { type: string }
    createdAt: { $ref: './common.yaml#/Instant' }
    state: { $ref: '#/SuggestionState' }
Task:
  type: object
  required:
    - id
    - userId
    - title
    - description
    - priority
    - lifecycle
    - timeBasis
    - subtasks
    - suggestions
    - createdAt
    - createdVia
    - etag
  properties:
    id: { $ref: './common.yaml#/TaskId' }
    userId: { $ref: './common.yaml#/UserId' }
    title: { type: string }
    description: { type: string }
    areaId: { $ref: './common.yaml#/AreaId' }
    due: { $ref: './common.yaml#/LocalDate' }
    priority: { $ref: '#/TaskPriority' }
    lifecycle: { $ref: '#/TaskLifecycle' }
    timeBasis: { $ref: '#/TimeBasis' }
    subtasks:
      type: array
      items: { $ref: '#/Subtask' }
    estimate: { $ref: '#/Estimate' }
    suggestions:
      type: array
      items: { $ref: '#/EstimateSuggestion' }
    recurrenceRuleId:
      description: Set for a recurring Task. The rule is a record of its own.
      $ref: './common.yaml#/RecurrenceRuleId'
    createdAt: { $ref: './common.yaml#/Instant' }
    createdVia: { $ref: '#/TaskCreatedVia' }
    completedAt: { $ref: './common.yaml#/Instant' }
    archivedAt: { $ref: './common.yaml#/Instant' }
    etag: { $ref: './common.yaml#/ETag' }
# ------------------------------------------------------------ Recurrence
RecurrencePattern:
  oneOf:
    - title: DailyPattern
      type: object
      required: [freq]
      properties:
        freq: { const: daily }
    - title: WeekdaysPattern
      type: object
      required: [freq]
      properties:
        freq: { const: weekdays }
    - title: WeeklyPattern
      type: object
      required: [freq, daysOfWeek]
      properties:
        freq: { const: weekly }
        daysOfWeek:
          type: array
          items: { $ref: './common.yaml#/DayOfWeek' }
    - title: MonthlyPattern
      type: object
      required: [freq, dayOfMonth]
      properties:
        freq: { const: monthly }
        dayOfMonth: { type: integer }
OccurrenceState:
  description: Closed enum.
  type: string
  enum: [pending, excluded, done, skipped, missed]
Occurrence:
  type: object
  required:
    - id
    - taskId
    - ruleId
    - scheduledDate
    - ruleVersion
    - materializedAt
    - state
    - stateChangedAt
  properties:
    id: { $ref: './common.yaml#/OccurrenceId' }
    taskId: { $ref: './common.yaml#/TaskId' }
    ruleId: { $ref: './common.yaml#/RecurrenceRuleId' }
    scheduledDate: { $ref: './common.yaml#/LocalDate' }
    ruleVersion: { type: integer }
    materializedAt: { $ref: './common.yaml#/Instant' }
    state: { $ref: '#/OccurrenceState' }
    stateChangedAt: { $ref: './common.yaml#/Instant' }

# ------------------------------------------------------- PlanningValue
CriterionScope:
  description: The Tasks a planning criterion covers.
  oneOf:
    - title: AllCriterionScope
      type: object
      required: [kind]
      properties:
        kind: { const: all }
    - title: AreaCriterionScope
      type: object
      required: [kind, areaId]
      properties:
        kind: { const: area }
        areaId: { $ref: './common.yaml#/AreaId' }
CriterionPolicy:
  type: object
  required: [scope, rangePolicy]
  properties:
    scope: { $ref: '#/CriterionScope' }
    rangePolicy: { $ref: '#/SuggestionBound' }
EstimatedPlanningValue:
  description: A planning value from an Estimate or a suggestion.
  type: object
  required: [base, lo, hi, criterionApplied, computedAt]
  properties:
    base:
      description: Closed enum.
      type: string
      enum: [estimate, suggestion]
    lo: { type: number }
    hi: { type: number }
    criterionApplied: { type: boolean }
    computedAt: { $ref: './common.yaml#/Instant' }
PlanningValue:
  description: >-
    The hours a Task is planned at (PlanningValue). 「適用」 of a criterion
    changes this value, not the Task.
  oneOf:
    - $ref: '#/EstimatedPlanningValue'
    - title: SubtasksPlanningValue
      type: object
      required:
        [base, lo, hi, unestimatedSubtasks, criterionApplied, computedAt]
      properties:
        base: { const: subtasks }
        lo: { type: number }
        hi: { type: number }
        unestimatedSubtasks: { type: integer }
        criterionApplied: { const: false }
        computedAt: { $ref: './common.yaml#/Instant' }
    - title: NonePlanningValue
      type: object
      required: [base, criterionApplied, computedAt]
      properties:
        base: { const: none }
        criterionApplied: { const: false }
        computedAt: { $ref: './common.yaml#/Instant' }

# ---------------------------------------------------------------- Sprint
SprintState:
  description: Closed enum.
  type: string
  enum: [planning, active, review, closed]
SprintTaskOutcome:
  description: Closed enum.
  type: string
  enum: [draft, planned, done, removed, carriedOver]
SprintTaskOrigin:
  description: Closed enum.
  type: string
  enum: [planning, midSprint]
GoalLink:
  description: Closed enum.
  type: string
  enum: [linked, unlinked]
SelfAssessment:
  description: Closed enum.
  type: string
  enum: [achieved, partly, notAchieved, notJudged]
RetroDecision:
  description: Closed enum.
  type: string
  enum: [continue, end, replace]
PlanSnapshot:
  description: The plan fixed at confirm.
  type: object
  required: [value, timeBasis]
  properties:
    value: { $ref: '#/PlanningValue' }
    timeBasis: { $ref: '#/TimeBasis' }
    estimateHours: { type: number }
    suggestion:
      type: object
      required: [id, lo, hi]
      properties:
        id: { $ref: './common.yaml#/EstimateSuggestionId' }
        lo: { type: number }
        hi: { type: number }
    occurrenceCount: { type: integer }
SprintTask:
  type: object
  required: [id, taskId, origin, addedAt, goalLink, outcome, etag]
  properties:
    id: { $ref: './common.yaml#/SprintTaskId' }
    taskId: { $ref: './common.yaml#/TaskId' }
    occurrenceIds:
      description: >-
        A recurring Task's occurrences in this Sprint. Left out for a Task
        that does not recur; empty when every occurrence is left out.
      type: array
      items: { $ref: './common.yaml#/OccurrenceId' }
    origin: { $ref: '#/SprintTaskOrigin' }
    addedAt: { $ref: './common.yaml#/Instant' }
    goalLink: { $ref: '#/GoalLink' }
    outcome: { $ref: '#/SprintTaskOutcome' }
    planSnapshot: { $ref: '#/PlanSnapshot' }
    carriedFrom: { $ref: './common.yaml#/SprintTaskId' }
    etag: { $ref: './common.yaml#/ETag' }
SprintGoal:
  type: object
  required: [areaId, text, etag]
  properties:
    areaId: { $ref: './common.yaml#/AreaId' }
    text: { type: string }
    plannedText: { type: string }
    selfAssessment: { $ref: '#/SelfAssessment' }
    etag: { $ref: './common.yaml#/ETag' }
SprintAreaSnapshotEntry:
  type: object
  required: [areaId, name, order]
  properties:
    areaId: { $ref: './common.yaml#/AreaId' }
    name: { type: string }
    order: { type: number }
CriterionUse:
  type: object
  required: [criterionId, appliedAtConfirm, etag]
  properties:
    criterionId: { $ref: './common.yaml#/PlanningCriterionId' }
    appliedAtConfirm: { type: boolean }
    retroDecision: { $ref: '#/RetroDecision' }
    etag: { $ref: './common.yaml#/ETag' }
DailyResolution:
  description: Closed enum.
  type: string
  enum:
    - selected
    - started
    - done
    - paused
    - deferred
    - removed
    - skipped
    - unresolved
ClosedResolution:
  description: Closed enum. How a choice for today was closed without being done.
  type: string
  enum: [paused, deferred, removed]
DailySelectionOrigin:
  description: Closed enum.
  type: string
  enum: [manual, recurringToday, midSprint, backlogCompletion]
DailySelection:
  type: object
  required: [id, date, sprintTaskId, origin, resolution, selectedAt]
  properties:
    id: { $ref: './common.yaml#/DailySelectionId' }
    date: { $ref: './common.yaml#/LocalDate' }
    sprintTaskId: { $ref: './common.yaml#/SprintTaskId' }
    occurrenceId: { $ref: './common.yaml#/OccurrenceId' }
    origin: { $ref: '#/DailySelectionOrigin' }
    resolution: { $ref: '#/DailyResolution' }
    selectedAt: { $ref: './common.yaml#/Instant' }
    startedAt: { $ref: './common.yaml#/Instant' }
    resolvedAt: { $ref: './common.yaml#/Instant' }
    closedBefore:
      type: object
      required: [resolution, at]
      properties:
        resolution: { $ref: '#/ClosedResolution' }
        at: { $ref: './common.yaml#/Instant' }
ActualTimeVia:
  description: Closed enum.
  type: string
  enum: [completion, pause, later]
ActualTime:
  type: object
  required: [sprintTaskId, hours, date, via, recordedAt]
  properties:
    sprintTaskId: { $ref: './common.yaml#/SprintTaskId' }
    occurrenceId: { $ref: './common.yaml#/OccurrenceId' }
    hours: { type: number }
    date: { $ref: './common.yaml#/LocalDate' }
    via: { $ref: '#/ActualTimeVia' }
    recordedAt: { $ref: './common.yaml#/Instant' }
InterruptNote:
  type: object
  required: [id, at, text, etag]
  properties:
    id: { $ref: './common.yaml#/InterruptNoteId' }
    at: { $ref: './common.yaml#/Instant' }
    text: { type: string }
    minutes: { type: number }
    etag: { $ref: './common.yaml#/ETag' }
RetroPin:
  type: object
  required: [kind]
  properties:
    kind:
      description: Closed enum.
      type: string
      enum:
        - sprintTask
        - dailySelection
        - occurrence
        - interrupt
        - goal
        - availableHours
    id:
      description: The pinned record's ID (an Area's for a goal).
      type: string
RetroImprovement:
  type: object
  required: [text]
  properties:
    text: { type: string }
    criterionId: { $ref: './common.yaml#/PlanningCriterionId' }
Retro:
  type: object
  required: [startedAt, pins, reflection, etag]
  properties:
    startedAt: { $ref: './common.yaml#/Instant' }
    completedAt: { $ref: './common.yaml#/Instant' }
    pins:
      type: array
      items: { $ref: '#/RetroPin' }
    reflection: { type: string }
    improvement: { $ref: '#/RetroImprovement' }
    etag: { $ref: './common.yaml#/ETag' }
Sprint:
  description: The aggregate root of its SprintTasks, DailySelections, Retro, ….
  type: object
  required:
    - id
    - userId
    - start
    - end
    - state
    - goals
    - tasks
    - areaSnapshot
    - dailySelections
    - actualTimes
    - interrupts
    - etag
  properties:
    id: { $ref: './common.yaml#/SprintId' }
    userId: { $ref: './common.yaml#/UserId' }
    start: { $ref: './common.yaml#/LocalDate' }
    end: { $ref: './common.yaml#/LocalDate' }
    state: { $ref: '#/SprintState' }
    previousSprintId: { $ref: './common.yaml#/SprintId' }
    availableHours: { type: number }
    plannedAvailableHours: { type: number }
    confirmedAt: { $ref: './common.yaml#/Instant' }
    goals:
      type: array
      items: { $ref: '#/SprintGoal' }
    tasks:
      type: array
      items: { $ref: '#/SprintTask' }
    areaSnapshot:
      type: array
      items: { $ref: '#/SprintAreaSnapshotEntry' }
    criterionUse: { $ref: '#/CriterionUse' }
    dailySelections:
      type: array
      items: { $ref: '#/DailySelection' }
    actualTimes:
      type: array
      items: { $ref: '#/ActualTime' }
    interrupts:
      type: array
      items: { $ref: '#/InterruptNote' }
    retro: { $ref: '#/Retro' }
    etag: { $ref: './common.yaml#/ETag' }

# ---------------------------------------------------- PlanningCriterion
CriterionState:
  description: Closed enum.
  type: string
  enum: [draft, active, ended, replaced]
PlanningCriterion:
  type: object
  required: [id, userId, policy, sourceSprintId, state, createdAt, etag]
  properties:
    id: { $ref: './common.yaml#/PlanningCriterionId' }
    userId: { $ref: './common.yaml#/UserId' }
    policy: { $ref: '#/CriterionPolicy' }
    sourceSprintId: { $ref: './common.yaml#/SprintId' }
    state: { $ref: '#/CriterionState' }
    replacedBy: { $ref: './common.yaml#/PlanningCriterionId' }
    createdAt: { $ref: './common.yaml#/Instant' }
    etag: { $ref: './common.yaml#/ETag' }
