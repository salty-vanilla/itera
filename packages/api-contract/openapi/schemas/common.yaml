# Shared values: record IDs, dates and times, the clock and errors.

# Record IDs are TypeIDs (ADR 0004 ID の形式): the kind's prefix, `_`, and a
# UUIDv7 in base32 (26 characters). The pattern also fixes the UUID's
# version (7, the 11th character is e or f) and variant (10, the 14th
# character is one of 89abrstv), as `parseId` of @itera/application does.
UserId:
  type: string
  pattern: '^user_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['user_01k6f3x3qhe7t9vb2q6n0m8r4s']
AreaId:
  type: string
  pattern: '^area_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['area_01k6f3x3qhe7t9vb2q6n0m8r4s']
TaskId:
  type: string
  pattern: '^task_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['task_01k6f3x3qhe7t9vb2q6n0m8r4s']
SubtaskId:
  type: string
  pattern: '^subtask_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['subtask_01k6f3x3qhe7t9vb2q6n0m8r4s']
EstimateSuggestionId:
  type: string
  pattern: '^estimate_suggestion_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['estimate_suggestion_01k6f3x3qhe7t9vb2q6n0m8r4s']
RecurrenceRuleId:
  type: string
  pattern: '^recurrence_rule_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['recurrence_rule_01k6f3x3qhe7t9vb2q6n0m8r4s']
OccurrenceId:
  type: string
  pattern: '^occurrence_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['occurrence_01k6f3x3qhe7t9vb2q6n0m8r4s']
SprintId:
  type: string
  pattern: '^sprint_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['sprint_01k6f3x3qhe7t9vb2q6n0m8r4s']
SprintTaskId:
  type: string
  pattern: '^sprint_task_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
  examples: ['sprint_task_01k6f3x3qhe7t9vb2q6n0m8r4s']
DailySelectionId:
  type: string
  pattern: '^daily_selection_[0-7][0-9a-hjkmnp-tv-z]{9}[ef][0-9a-hjkmnp-tv-z]{2}[89abrstv][0-9a-hjkmnp-tv-z]{12}$'
